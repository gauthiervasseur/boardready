<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Portrait of the Group Controller">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5DB3BA"/><stop offset="1" stop-color="#2C6E75"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- faint ledger lines -->
    <g stroke="#ffffff" stroke-opacity=".10" stroke-width="2">
      <path d="M0 30 H200 M0 52 H200 M0 74 H200 M0 96 H200 M0 118 H200 M0 140 H200"/>
    </g>
    <!-- cardigan, shirt, tie -->
    <path d="M24 200 C26 164 56 146 100 146 C144 146 174 164 176 200 Z" fill="#1F4E54"/>
    <path d="M80 146 L100 172 L120 146 Z" fill="#F7F7F2"/>
    <path d="M96 156 L104 156 L107 194 L100 200 L93 194 Z" fill="#002B49"/>
    <path d="M95 148 L105 148 L104 158 L96 158 Z" fill="#0A3A5C"/>
    <!-- neck and head -->
    <rect x="89" y="116" width="22" height="34" rx="9" fill="#A86F4C"/>
    <ellipse cx="71" cy="97" rx="6" ry="9" fill="#B97B55"/>
    <ellipse cx="129" cy="97" rx="6" ry="9" fill="#B97B55"/>
    <ellipse cx="100" cy="94" rx="29" ry="35" fill="#C68B62"/>
    <!-- short neat hair with a side part -->
    <path d="M70 92 C66 60 84 50 102 50 C122 50 136 62 131 92 C128 78 122 70 112 66 C100 70 84 70 74 76 C72 80 71 86 70 92 Z" fill="#2B2B2E"/>
    <path d="M108 52 C104 58 104 64 108 66" stroke="#46464B" stroke-width="2" fill="none"/>
    <!-- brows, round glasses, eyes -->
    <path d="M82 84 L96 84" stroke="#232326" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M104 84 L118 84" stroke="#232326" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="89" cy="95" r="2.7" fill="#161618"/>
    <circle cx="111" cy="95" r="2.7" fill="#161618"/>
    <circle cx="89" cy="95" r="10" fill="#ffffff" fill-opacity=".12" stroke="#E7E3D4" stroke-width="2.2"/>
    <circle cx="111" cy="95" r="10" fill="#ffffff" fill-opacity=".12" stroke="#E7E3D4" stroke-width="2.2"/>
    <path d="M99 95 L101 95" stroke="#E7E3D4" stroke-width="2.2"/>
    <!-- nose and a neutral mouth -->
    <path d="M100 99 Q97 107 101 109" stroke="#A5704E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M92 117 L108 117" stroke="#6E3B2E" stroke-width="2.6" stroke-linecap="round"/>
    <!-- pencil tucked behind the ear -->
    <g transform="translate(5 2) rotate(-28 134 80)"><rect x="128" y="62" width="6" height="34" rx="1.5" fill="#F2C14E"/><path d="M128 96 L131 103 L134 96 Z" fill="#E8C9A0"/></g>
  </g>
</svg>

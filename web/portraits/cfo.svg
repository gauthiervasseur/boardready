    <path d="M84 146 L100 178 L116 146 Z" fill="#672A7D"/>
    <path d="M82 146 L100 182 L88 200 L64 200 L72 152 Z" fill="#16314F"/>
    <path d="M118 146 L100 182 L112 200 L136 200 L128 152 Z" fill="#16314F"/>
    <!-- neck and head -->
    <rect x="89" y="116" width="22" height="34" rx="9" fill="#D9A585"/>
    <ellipse cx="71" cy="98" rx="6" ry="9" fill="#E8B796"/>
    <ellipse cx="129" cy="98" rx="6" ry="9" fill="#E8B796"/>
    <circle cx="70" cy="109" r="2.6" fill="#E9E3F2"/>
    <circle cx="130" cy="109" r="2.6" fill="#E9E3F2"/>
    <ellipse cx="100" cy="94" rx="29" ry="35" fill="#F1C7A6"/>
    <!-- fringe -->
    <path d="M69 92 C68 62 86 52 104 52 C124 52 136 66 132 92 C126 80 112 70 94 70 C84 76 76 84 69 92 Z" fill="#6B3424"/>

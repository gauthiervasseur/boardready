<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Portrait of Elena Varga, the Skeptical CFO">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B4F7A"/><stop offset="1" stop-color="#002B49"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="160" cy="40" r="46" fill="#77C5D5" opacity=".14"/>
    <!-- back hair -->
    <path d="M62 100 C58 58 80 44 102 44 C128 44 144 62 140 102 C139 120 136 134 130 140 L72 140 C66 132 63 118 62 100 Z" fill="#5A2A1E"/>
    <!-- blazer and blouse -->

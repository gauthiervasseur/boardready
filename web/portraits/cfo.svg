    <path d="M83 85 Q90 82 96 85" stroke="#4A2419" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M104 85 Q111 81 118 84" stroke="#4A2419" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="90" cy="95" r="2.8" fill="#1D1D1F"/>
    <circle cx="111" cy="95" r="2.8" fill="#1D1D1F"/>
    <rect x="79" y="88" width="21" height="14" rx="5" fill="#ffffff" fill-opacity=".12" stroke="#0E1F33" stroke-width="2"/>
    <rect x="101" y="88" width="21" height="14" rx="5" fill="#ffffff" fill-opacity=".12" stroke="#0E1F33" stroke-width="2"/>
    <!-- nose and a dry, level mouth -->
    <path d="M100 99 Q97 107 101 109" stroke="#C98E6E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M92 117 Q100 119 108 116" stroke="#9A4A45" stroke-width="2.6" fill="none" stroke-linecap="round"/>

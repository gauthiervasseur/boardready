<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Portrait of the Red-Team Reviewer">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D2453B"/><stop offset="1" stop-color="#7E1A16"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- crosshair motif -->
    <g stroke="#ffffff" stroke-opacity=".13" stroke-width="2.5" fill="none">
      <circle cx="100" cy="96" r="78"/><path d="M100 0 V30 M100 170 V200 M0 96 H24 M176 96 H200"/>
    </g>
    <!-- hoodie and hood -->
    <path d="M18 200 C20 160 52 140 100 140 C148 140 180 160 182 200 Z" fill="#26262B"/>
    <path d="M54 170 C46 104 60 46 100 42 C140 46 154 104 146 170 C132 150 118 146 100 146 C82 146 68 150 54 170 Z" fill="#303036"/>
    <path d="M68 116 C64 74 80 58 100 58 C120 58 136 74 132 116 C130 140 116 150 100 150 C84 150 70 140 68 116 Z" fill="#141417"/>
    <!-- drawstrings -->
    <path d="M86 150 L84 184 M114 150 L116 184" stroke="#E9E9EC" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="84" cy="186" r="3" fill="#E9E9EC"/><circle cx="116" cy="186" r="3" fill="#E9E9EC"/>
    <!-- face -->
    <ellipse cx="100" cy="100" rx="27" ry="33" fill="#E0AC88"/>
    <path d="M73 92 C74 70 88 64 100 64 C114 64 126 70 127 92 C120 80 110 76 100 76 C90 76 80 80 73 92 Z" fill="#1E1E22"/>
    <!-- one raised, one lowered brow; narrowed eyes; a sideways smile -->
    <path d="M82 91 L96 94" stroke="#2A1A14" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M104 92 L118 86" stroke="#2A1A14" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M85 100 Q89 97 94 100" stroke="#161618" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M106 99 Q111 96 116 99" stroke="#161618" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M100 103 Q97 111 101 113" stroke="#B9805F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M91 121 Q101 125 110 117" stroke="#7E2A24" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
